name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # 一次构建产出两个包：无根（rootless）与 隐根（roothide）。
    # 隐根必须用 THEOS_PACKAGE_SCHEME=roothide 构建 —— 路径会被重写到
    # RootHide 的隐藏 jbroot，用户不再需要手动转换 rootless 包。
    # 参考：EchoReborn（lvxl147）的 CI 就是这么做的。
    name: Build (${{ matrix.scheme }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scheme: [ rootless, roothide ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 必须用 waruhachi/theos：主线 theos/theos 没有 roothide 打包方案
      # （报 'roothide' package scheme does not exist）。
      # EchoReborn（lvxl147）同样用这个 action 出 rootless / roothide 两种包。
      - name: Set up Theos (roothide-capable)
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'waruhachi/theos'
          theos-branch: 'main'
          sdks-src: 'waruhachi/sdks'
          sdks-branch: 'main'

      - name: Install tools and vet Theos
        run: |
          brew install make dpkg
          brew install ldid || true
          command -v dpkg-deb
          echo "THEOS=$THEOS"
          ls "$THEOS/makefiles/common.mk"
          ls "$THEOS/sdks" | head -5

      # 设置面板是 PreferenceBundle，不能用 Theos 的 subproject 机制
      # （subproject 要求产出 *.subproject.a，bundle 不产出，会让主 dylib 链接失败）。
      # 这里按同一 scheme 单独构建，再把产物拷进主工程的 layout/ 一起打包。
      # 注意：切 scheme 必须先 clean，否则 .theos 里的旧产物会串。
      - name: Build prefs bundle
        run: |
          MAKE=gmake
          command -v gmake >/dev/null 2>&1 || MAKE=make
          SCHEME=${{ matrix.scheme }}
          (cd SplitJumpPrefs && "$MAKE" clean THEOS_PACKAGE_SCHEME=$SCHEME) || true
          (cd SplitJumpPrefs && "$MAKE" THEOS_PACKAGE_SCHEME=$SCHEME)
          BUNDLE=$(find SplitJumpPrefs -type d -name "SplitJumpPrefs.bundle" | head -n1)
          if [ -z "$BUNDLE" ]; then
            echo "::error::prefs bundle not found"
            find SplitJumpPrefs -name '*.bundle'
            exit 1
          fi
          echo "prefs bundle: $BUNDLE"
          ls -la "$BUNDLE"
          mkdir -p layout/Library/PreferenceBundles
          rm -rf layout/Library/PreferenceBundles/SplitJumpPrefs.bundle
          cp -R "$BUNDLE" layout/Library/PreferenceBundles/

      - name: Build package
        run: |
          MAKE=gmake
          command -v gmake >/dev/null 2>&1 || MAKE=make
          SCHEME=${{ matrix.scheme }}
          echo "scheme: $SCHEME"
          "$MAKE" clean package THEOS_PACKAGE_SCHEME=$SCHEME FINALPACKAGE=1
          ls -la packages/

      # macOS 的 dpkg 默认产出 data.tar.lzma，Sileo / Zebra 不支持 → 强制 gzip。
      # 同时按 scheme 写 Depends：roothide 只依赖 firmware，避免装不上。
      - name: Repack as gzip and set Depends
        run: |
          set -e
          SCHEME=${{ matrix.scheme }}
          case "$SCHEME" in
            roothide) DEPENDS="firmware (>= 15.0)" ;;
            *)        DEPENDS="mobilesubstrate, preferenceloader, firmware (>= 15.0)" ;;
          esac

          DEB=$(ls packages/*.deb | head -n1)
          echo "source deb: $DEB"
          rm -rf /tmp/rebuild && mkdir -p /tmp/rebuild
          dpkg-deb -x "$DEB" /tmp/rebuild/
          dpkg-deb -e "$DEB" /tmp/rebuild/DEBIAN
          rm -f packages/*.deb
          mkdir -p packages

          BASE_VER=$(python3 -c "import re;print(re.search(r'(?m)^Version:\s*(\S+)',open('layout/DEBIAN/control',encoding='utf-8').read()).group(1))")
          echo "base version: $BASE_VER / scheme: $SCHEME / depends: $DEPENDS"

          python3 - /tmp/rebuild/DEBIAN/control "$BASE_VER" "$DEPENDS" "$SCHEME" <<'PY'
          import re, sys
          path, ver, depends, scheme = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          t = open(path, encoding='utf-8').read()
          final = ver if scheme == 'rootless' else ver + '+hidden'
          t = re.sub(r'(?m)^Version:.*$', 'Version: ' + final, t)
          t = re.sub(r'(?m)^Depends:.*$', 'Depends: ' + depends, t)
          open(path, 'w', encoding='utf-8').write(t)
          print('final version:', final, '| depends:', depends)
          PY

          # 文件名必须带上 scheme，否则两个变体会互相覆盖
          dpkg-deb -Zgzip -b /tmp/rebuild "packages/com.lvxl524.splitjump_${BASE_VER}_${SCHEME}_iphoneos-arm64.deb"
          ls -la packages/

      - name: Verify data archive and control
        run: |
          python3 - <<'PY'
          import glob, gzip, io, tarfile

          deb = glob.glob('packages/*.deb')[0]
          print('=== deb:', deb)

          data = open(deb, 'rb').read()
          assert data[:8] == b'!<arch>\n', 'not an ar archive'

          pos, members = 8, {}
          while pos + 60 <= len(data):
              name = data[pos:pos+16].decode('ascii', 'replace').strip().rstrip('/')
              size = int(data[pos+48:pos+58].decode('ascii').strip())
              members[name] = data[pos+60:pos+60+size]
              pos += 60 + size + (size % 2)

          print('    ar members:', sorted(members))
          if 'data.tar.lzma' in members:
              raise SystemExit('FAIL: data.tar.lzma is not supported by Sileo')
          assert 'data.tar.gz' in members, 'expected data.tar.gz'

          ctl_name = [k for k in members if k.startswith('control.tar')][0]
          ctl_raw = members[ctl_name]
          ctl_bytes = gzip.decompress(ctl_raw) if ctl_name.endswith('.gz') else ctl_raw
          tf = tarfile.open(fileobj=io.BytesIO(ctl_bytes))
          member = tf.extractfile('./control') or tf.extractfile('control')
          text = member.read().decode('utf-8')
          print(text)
          print('OK')
          PY

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitJump-deb-${{ matrix.scheme }}
          path: packages/*.deb
          if-no-files-found: error
