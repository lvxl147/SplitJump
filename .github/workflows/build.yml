name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and tools
        run: |
          brew install make dpkg
          brew install ldid || true
          command -v dpkg-deb
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          ls "$THEOS/makefiles/common.mk"

      # 设置面板是 PreferenceBundle，不能用 Theos 的 subproject 机制
      # （subproject 要求产出 *.subproject.a，bundle 不产出，会让主 dylib 链接失败）。
      # 这里单独构建，再把产物拷进主工程的 layout/，随主包一起打包。
      - name: Build prefs bundle
        run: |
          MAKE=gmake
          command -v gmake >/dev/null 2>&1 || MAKE=make
          (cd SplitJumpPrefs && "$MAKE" THEOS_PACKAGE_SCHEME=rootless)
          BUNDLE=$(find SplitJumpPrefs -type d -name "SplitJumpPrefs.bundle" | head -n1)
          if [ -z "$BUNDLE" ]; then
            echo "prefs bundle not found:"
            find SplitJumpPrefs -name '*.bundle'
            exit 1
          fi
          echo "prefs bundle: $BUNDLE"
          ls -la "$BUNDLE"
          mkdir -p layout/Library/PreferenceBundles
          rm -rf layout/Library/PreferenceBundles/SplitJumpPrefs.bundle
          cp -R "$BUNDLE" layout/Library/PreferenceBundles/
          ls -la layout/Library/PreferenceBundles/

      - name: Build package
        run: |
          MAKE=gmake
          command -v gmake >/dev/null 2>&1 || MAKE=make
          echo "using $MAKE"
          "$MAKE" package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          ls -la packages/

      # macOS 上的 dpkg 默认用 lzma 压缩 data.tar；Sileo / Zebra 不支持 lzma，
      # 会表现为「无法解压 / 安装失败」。这里强制重打包为 gzip。
      # 同时产出两个变体：
      #   * rootless（无根）  ：Depends 带 mobilesubstrate / preferenceloader
      #   * hidden-root（隐根）：Depends 只剩 firmware，任何 rootless 环境都能装
      - name: Repack into rootless and hidden-root variants
        run: |
          set -e
          DEB=$(ls packages/*.deb | head -n1)
          echo "source deb: $DEB"
          rm -rf /tmp/rebuild && mkdir -p /tmp/rebuild
          dpkg-deb -x "$DEB" /tmp/rebuild/
          dpkg-deb -e "$DEB" /tmp/rebuild/DEBIAN
          rm -f packages/*.deb
          mkdir -p packages

          make_variant() {
            local dir="$1" ver="$2" depends="$3" out="$4"
            rm -rf "$dir" && cp -R /tmp/rebuild "$dir"
            python3 - "$dir/DEBIAN/control" "$ver" "$depends" <<'PY'
          import re, sys
          path, ver, depends = sys.argv[1], sys.argv[2], sys.argv[3]
          t = open(path, encoding='utf-8').read()
          t = re.sub(r'(?m)^Version:.*$', 'Version: ' + ver, t)
          t = re.sub(r'(?m)^Depends:.*$', 'Depends: ' + depends, t)
          open(path, 'w', encoding='utf-8').write(t)
          PY
            dpkg-deb -Zgzip -b "$dir" "packages/$out"
          }

          make_variant /tmp/v_rootless "1.3.0" \
            "mobilesubstrate, preferenceloader, firmware (>= 15.0)" \
            "com.lvxl524.splitjump_1.3.0_rootless_iphoneos-arm64.deb"

          make_variant /tmp/v_hidden "1.3.0+hidden" \
            "firmware (>= 15.0)" \
            "com.lvxl524.splitjump_1.3.0+hidden_iphoneos-arm64.deb"

          ls -la packages/

      - name: Verify data archives and control versions
        run: |
          python3 - <<'PY'
          import glob, gzip, io, tarfile

          for deb in sorted(glob.glob('packages/*.deb')):
              print('=== deb:', deb)

              data = open(deb, 'rb').read()
              assert data[:8] == b'!<arch>\n', 'not an ar archive'

              pos, members = 8, {}
              while pos + 60 <= len(data):
                  name = data[pos:pos+16].decode('ascii', 'replace').strip().rstrip('/')
                  size = int(data[pos+48:pos+58].decode('ascii').strip())
                  members[name] = data[pos+60:pos+60+size]
                  pos += 60 + size + (size % 2)

              print('    ar members:', sorted(members))

              if 'data.tar.lzma' in members:
                  raise SystemExit('FAIL: data.tar.lzma is not supported by Sileo')
              assert 'data.tar.gz' in members, 'expected data.tar.gz, got %s' % sorted(members)

              ctl_name = [k for k in members if k.startswith('control.tar')][0]
              ctl_raw = members[ctl_name]
              ctl_bytes = gzip.decompress(ctl_raw) if ctl_name.endswith('.gz') else ctl_raw
              tf = tarfile.open(fileobj=io.BytesIO(ctl_bytes))
              member = tf.extractfile('./control') or tf.extractfile('control')
              text = member.read().decode('utf-8')

              version = [l.split(':', 1)[1].strip() for l in text.splitlines()
                         if l.startswith('Version:')][0]
              depends = [l.split(':', 1)[1].strip() for l in text.splitlines()
                         if l.startswith('Depends:')][0]
              print('    version =', version)
              print('    depends =', depends)

          print('OK: both variants verified')
          PY

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitJump-deb
          path: packages/*.deb
          if-no-files-found: error
