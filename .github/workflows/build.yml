name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and tools
        run: |
          brew install make dpkg
          brew install ldid || true
          command -v dpkg-deb
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          ls "$THEOS/makefiles/common.mk"

      - name: Build package
        run: |
          MAKE=gmake
          command -v gmake >/dev/null 2>&1 || MAKE=make
          echo "using $MAKE"
          "$MAKE" package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          ls -la packages/

      # macOS 上的 dpkg 默认用 lzma 压缩 data.tar；Sileo / Zebra 不支持 lzma，
      # 会表现为「无法解压 / 安装失败」。这里强制重打包为 gzip。
      - name: Repack data archive as gzip
        run: |
          set -e
          DEB=$(ls packages/*.deb | head -n1)
          echo "source deb: $DEB"
          rm -rf /tmp/rebuild && mkdir -p /tmp/rebuild
          dpkg-deb -x "$DEB" /tmp/rebuild/
          dpkg-deb -e "$DEB" /tmp/rebuild/DEBIAN
          rm -f packages/*.deb
          mkdir -p packages
          dpkg-deb -Zgzip -b /tmp/rebuild "packages/$(basename "$DEB")"
          ls -la packages/

      - name: Verify data archive and control version
        run: |
          python3 - <<'PY'
          import glob, gzip, io, tarfile

          deb = glob.glob('packages/*.deb')[0]
          print('deb:', deb)

          data = open(deb, 'rb').read()
          assert data[:8] == b'!<arch>\n', 'not an ar archive'

          pos, members = 8, {}
          while pos + 60 <= len(data):
              name = data[pos:pos+16].decode('ascii', 'replace').strip().rstrip('/')
              size = int(data[pos+48:pos+58].decode('ascii').strip())
              members[name] = data[pos+60:pos+60+size]
              pos += 60 + size + (size % 2)

          print('ar members:', sorted(members))

          if 'data.tar.lzma' in members:
              raise SystemExit('FAIL: data.tar.lzma is not supported by Sileo')
          assert 'data.tar.gz' in members, 'expected data.tar.gz, got %s' % sorted(members)

          ctl_name = [k for k in members if k.startswith('control.tar')][0]
          ctl_raw = members[ctl_name]
          ctl_bytes = gzip.decompress(ctl_raw) if ctl_name.endswith('.gz') else ctl_raw
          tf = tarfile.open(fileobj=io.BytesIO(ctl_bytes))
          member = tf.extractfile('./control') or tf.extractfile('control')
          text = member.read().decode('utf-8')

          print('--- control ---')
          print(text)
          version = [l.split(':', 1)[1].strip() for l in text.splitlines()
                     if l.startswith('Version:')][0]
          print('OK: version =', version)
          PY

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitJump-deb
          path: packages/*.deb
          if-no-files-found: error
